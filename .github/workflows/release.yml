name: Publish verified packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after all checks (requires configured trusted publishing)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check && pnpm test:browser && pnpm audit --audit-level high && pnpm release:check
      - name: Publish core
        if: inputs.publish
        working-directory: packages/core
        run: npm publish --access public --provenance
      - name: Publish React adapter
        if: inputs.publish
        working-directory: packages/react
        run: pnpm publish --access public --provenance --no-git-checks
