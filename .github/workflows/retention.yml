name: Participation retention cleanup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: participation-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove expired participation records
        env:
          FLURI_MAINTENANCE_KEY: ${{ secrets.FLURI_MAINTENANCE_KEY }}
        run: |
          test -n "$FLURI_MAINTENANCE_KEY"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            --request POST 'https://winter.fluri.xyz/api/maintenance/cleanup' \
            --header "Authorization: Bearer $FLURI_MAINTENANCE_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}'
